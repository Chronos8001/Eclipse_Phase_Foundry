name: Release

# Publishing a GitHub release tagged vX.Y.Z builds the compendiums, stamps the manifest
# and attaches system.json + ep1e.zip, so Foundry / The Forge can install from:
# https://github.com/Chronos8001/Eclipse_Phase_Foundry/releases/latest/download/system.json
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node tools/test-rules.mjs

      - name: Stamp manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const { TAG, REPO } = process.env;
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));
            m.version = TAG.replace(/^v/, "");
            m.manifest = `https://github.com/${REPO}/releases/latest/download/system.json`;
            m.download = `https://github.com/${REPO}/releases/download/${TAG}/ep1e.zip`;
            fs.writeFileSync("system.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Package
        run: zip -r ep1e.zip system.json module templates styles lang LICENSE README.md packs -x "packs/_source/*"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            ep1e.zip
